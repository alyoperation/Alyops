 <div class="card sc"><table><tr><th>Tarih</th><th>Uçuş</th><th>Rota</th><th>Pax</th><th>STD</th><th>DC</th><th>OTP</th><th>GTP</th><th>Kod</th></tr>${cs.map(({f,c})=>`<tr><td>${fd(f.date)}</td><td>${esc(f.fn)}</td><td>${esc(f.route)}</td><td>${ttl(f)}</td><td>${f.std||''}</td><td>${(f.t||{}).dc||''}</td><td class="${c.otp?'ok':c.otp===false?'no':''}">${yn(c.otp)}</td><td class="${c.gtp?'ok':c.gtp===false?'no':''}">${yn(c.gtp)}</td><td>${esc(f.dcode)}</td></tr>`).join('')}</table></div>`}
function dayReport(d){const a=Object.values(F).filter(f=>f.date===d).sort((x,y)=>(x.std||'').localeCompare(y.std||''));if(!a.length)return '';
const p=n=>String(n||0).padStart(2,'0'),cs=a.map(f=>({f,c:calc(f)})),o=cs.filter(x=>x.c.otp!=null),g=cs.filter(x=>x.c.gtp!=null),pc=(n,m)=>m?Math.round(n/m*100)+'%':'-',oo=o.filter(x=>x.c.otp).length,gg=g.filter(x=>x.c.gtp).length,stn=(a[0].route||'').split('-')[0];
let s=`*${stn} DAILY STATION REPORT*\n${fd(d)}\n—————————— ———\nFlights: ${a.length} | Pax: ${a.reduce((n,f)=>n+ttl(f),0)}\nOTP: ${oo}/${o.length} (${pc(oo,o.length)}) | GTP: ${gg}/${g.length} (${pc(gg,g.length)})\n`;
cs.forEach(({f,c})=>{const t=f.t||{};s+=`\n*${f.fn}* ${f.route} ${f.ac}\nPax: ${p(f.pc)}C/${p(f.py)}Y/${p(f.pi)}INF (TTL ${ttl(f)})\nSTD ${f.std||'--:--'} | DC ${t.dc||'--:--'} | NOSE OUT ${t.no||'--:--'}\nOTP: ${yn(c.otp)}${c.otp===false?` (${c.dl} MIN ${f.dcode||''})`:''} | GTP: ${yn(c.gtp)} (${c.g??'-'}/${f.plan||55} min)\n`});
const dl=cs.filter(x=>x.c.otp===false);if(dl.length){s+=`\n*Delays*\n`;dl.forEach(({f,c})=>s+=`${f.fn} - ${c.dl} MIN - ${f.dcode||'-'}${f.remark?' - '+f.remark:''}\n`)}
return s+`\n*All are local times*`}
function dayView(){const r=dayReport(dayd);return `<div class="row"><button id="back">← Liste</button></div><h2>Gün sonu raporu</h2><div class="card"><label class="mu">Tarih</label><input type="date" id="dd" value="${dayd}"></div>`+(r?`<textarea class="r" id="rep" readonly>${esc(r)}</textarea><button class="p" id="copy" style="width:100%;margin-top:8px">Raporu kopyala</button>`:`<p class="mu">Bu tarihte uçuş kaydı yok.</p>`)}
function loginView(){return `<div class="card g"><div class="w"><label>E-posta</label><input id="em" type="email" autocomplete="username"></div><div class="w"><label>Şifre</label><input id="pw" type="password" autocomplete="current-password"></div><button class="p w" id="li">Giriş yap</button></div>`}
function render(){document.getElementById('t-ops').className=tab==='ops'?'on':'';document.getElementById('t-wh').className=tab==='wh'?'on':'';
 const el=document.getElementById('app');el.innerHTML=!user?loginView():tab==='wh'?wh():dayv?dayView():(cur&&F[cur]?detail(F[cur]):list());tr(el);document.documentElement.lang=L;document.getElementById('h1').textContent='✈️ '+tt('İstasyon Operasyon Kaydı');document.getElementById('t-ops').textContent=tt('Operasyon');document.getElementById('t-wh').textContent=tt('Veri Ambarı');document.getElementById('lang').value=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';document.querySelector('.tabs').style.display=user?'flex':'none';const lo=document.getElementById('lo');lo.style.display=user?'':'none';lo.textContent=tt('Çıkış');setW(wk,wx)}
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-open]');if(!t)return;
 if(t.id==='li'){firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value).catch(e=>setW('Giriş başarısız',' ('+(e&&e.code)+')'))}else if(t.id==='lo'){firebase.auth().signOut()}else if(t.id==='t-ops'){tab='ops';dayv=false;render()}else if(t.id==='t-wh'){tab='wh';render()}
 else if(t.id==='new')newFlight();else if(t.id==='back'){cur=null;dayv=false;render()}else if(t.id==='day'){dayv=true;dayd=dayd||today();render()}
 else if(t.dataset.open){cur=t.dataset.open;render()}
 else if(t.dataset.now){save(cur,{t:{[t.dataset.now]:hm()}});render()}
 else if(t.id==='copy'){const r=document.getElementById('rep');r.select();try{await navigator.clipboard.writeText(r.value);t.textContent=tt('Kopyalandı ✓')}catch(_){try{document.execCommand('copy');t.textContent=tt('Kopyalandı ✓')}catch(__){t.textContent=tt('Metni seçip kopyalayın')}}}
 else if(t.id==='dl'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='istasyon-veri-'+wh.from+'_'+wh.to+'.csv';document.body.appendChild(a);a.click();a.remove()}catch(_){const x=document.createElement('textarea');x.value=csv;x.style.height='160px';t.after(x);x.select()}}});
document.addEventListener('change',e=>{const i=e.target;if(i.id==='lang'){L=i.value;try{localStorage.setItem('lang',L)}catch(_){}render();return}if(i.id==='dd'){dayd=i.value;render();return}
 if(i.dataset.k){save(cur,{t:{[i.dataset.k]:i.value}});render()}
 else if(i.dataset.f==='ac'){const v=i.tagName==='SELECT'&&i.value==='__other'?'':i.value;save(cur,AC[v]?{ac:v,cap:AC[v]}:{ac:v});render()}else if(i.dataset.f==='fn'){const v=i.tagName==='SELECT'&&i.value==='__other'?'':i.value.toUpperCase().replace(/\s/g,''),p={fn:v};if(SCH[v])p.std=SCH[v];const m=v.match(/^([A-Z]{2})(\d+)$/);if(m)p.inFn=m[1]+(+m[2]-1);save(cur,p);render()}else if(i.dataset.f){const n=['pc','py','pi','plan'].includes(i.dataset.f);save(cur,{[i.dataset.f]:n?+i.value||0:i.value});render()}
 else if(i.id==='wf'){wh.from=i.value;render()}else if(i.id==='wt'){wh.to=i.value;render()}else if(i.id==='wq'){wh.q=i.value;render()}});
function ready(){
 if(!FB.apiKey||FB.apiKey.startsWith('BURAYA')){setW('\u26a0\ufe0f Firebase ayarı girilmemiş');return}
 firebase.initializeApp(FB);db=firebase.firestore();
 firebase.auth().onAuthStateChanged(u=>{user=u;if(unsub){unsub();unsub=null}
  if(u){setW('');unsub=db.collection('flights').onSnapshot(s=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName))return;F={};s.docs.forEach(d=>{F[d.id]=Object.assign({t:{},by:{}},d.data())});render()},e=>{setW('\u26a0\ufe0f Veri okunamadı',' ('+(e&&e.code)+')')})}else{F={};cur=null}
  render()})}
render();ready();
</script></body></html>
